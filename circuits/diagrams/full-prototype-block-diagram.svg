<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
  <title id="title">Staged wireless power-transfer development</title>
  <desc id="desc">Four development stages cover the resonant link, switching transmitter, receiver conversion and physical validation.</desc>
  <rect width="1000" height="460" fill="#ffffff"/>
  <g font-family="Arial, sans-serif" fill="#172033">
    <g transform="translate(35 45)"><rect width="210" height="330" rx="10" fill="#e9f4ff" stroke="#1976b9" stroke-width="2"/><text x="105" y="42" text-anchor="middle" font-size="21" font-weight="bold">Stage 1</text><text x="105" y="72" text-anchor="middle" font-size="17">Resonant link</text><text x="25" y="125" font-size="15">• sine source</text><text x="25" y="160" font-size="15">• compensated coils</text><text x="25" y="195" font-size="15">• coupling sweep</text><text x="25" y="230" font-size="15">• resistive load</text><text x="25" y="280" font-size="14">Current validated model</text></g>
    <g transform="translate(275 45)"><rect width="210" height="330" rx="10" fill="#f1f3f6" stroke="#667085" stroke-width="2"/><text x="105" y="42" text-anchor="middle" font-size="21" font-weight="bold">Stage 2</text><text x="105" y="72" text-anchor="middle" font-size="17">Transmitter</text><text x="25" y="125" font-size="15">• oscillator</text><text x="25" y="160" font-size="15">• gate driver</text><text x="25" y="195" font-size="15">• MOSFET bridge</text><text x="25" y="230" font-size="15">• current protection</text><text x="25" y="280" font-size="14">Planned</text></g>
    <g transform="translate(515 45)"><rect width="210" height="330" rx="10" fill="#f1f3f6" stroke="#667085" stroke-width="2"/><text x="105" y="42" text-anchor="middle" font-size="21" font-weight="bold">Stage 3</text><text x="105" y="72" text-anchor="middle" font-size="17">Receiver</text><text x="25" y="125" font-size="15">• rectifier</text><text x="25" y="160" font-size="15">• DC filter</text><text x="25" y="195" font-size="15">• overvoltage clamp</text><text x="25" y="230" font-size="15">• 5 V regulator</text><text x="25" y="280" font-size="14">Planned</text></g>
    <g transform="translate(755 45)"><rect width="210" height="330" rx="10" fill="#f1f3f6" stroke="#667085" stroke-width="2"/><text x="105" y="42" text-anchor="middle" font-size="21" font-weight="bold">Stage 4</text><text x="105" y="72" text-anchor="middle" font-size="17">Validation</text><text x="25" y="125" font-size="15">• coil measurement</text><text x="25" y="160" font-size="15">• alignment tests</text><text x="25" y="195" font-size="15">• thermal tests</text><text x="25" y="230" font-size="15">• DC-to-DC efficiency</text><text x="25" y="280" font-size="14">Planned</text></g>
  </g>
</svg>

